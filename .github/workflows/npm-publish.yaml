name: Upload npm Package

on:
  release:
    types: [created]

jobs:
  publish:
    name: Build WebAssembly and stage it on npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: wasm
    env:
      LLVM_BIN: /usr/lib/llvm-22/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install LLVM 22 and its clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y clang-tidy-22
      - name: Set the version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Build and stage for approval
        run: npm stage publish ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
