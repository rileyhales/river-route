name: Upload npm Package

on:
  release:
    types: [created]

jobs:
  publish:
    name: Build WebAssembly and publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: wasm
    env:
      LLVM_BIN: /usr/lib/llvm-22/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install river-route, whose rr compile builds the WebAssembly
        working-directory: .
        run: |
          uv sync --locked --no-dev --python 3.14
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install LLVM 22 and its clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y clang-tidy-22
      - name: Set the version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - name: Build and publish
        run: npm publish ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
