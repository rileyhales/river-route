name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'

jobs:
  # Runs on every push and pull request. The synthetic network tests need no downloaded data, so this job
  # gates changes on real routing coverage. The vpu parametrized tests skip when the data is not present.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ -v

  # Downloads the reference VPU data from S3 and runs the full suite against known-good discharge.
  # Manual because the download is large; the fast job above covers every pull request.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-v1-${{ hashFiles('tests/download_test_data.sh') }}

      - name: Download test data
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: ./tests/download_test_data.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --python 3.14

      - name: Run tests
        run: uv run pytest tests/ -v -s
