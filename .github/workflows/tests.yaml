name: Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'main'

jobs:
  download-test-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-v1-${{ hashFiles('tests/download_test_data.sh') }}

      - name: Download test data
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: ./tests/download_test_data.sh

  test:
    needs: download-test-data
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Restore test data cache
        uses: actions/cache@v4
        with:
          path: tests/data
          key: test-data-v1-${{ hashFiles('tests/download_test_data.sh') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest tests/ -v -s
