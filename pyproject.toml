[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "river-route"
dynamic = ["version"]
description = "Perform river routing computations on large river networks"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
authors = [
    { name = "Riley Hales PhD" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "geopandas",
    "netcdf4",
    "networkx",
    "numba",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "shapely",
    "tqdm",
    "xarray",
    "dask",
    "pyarrow",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
]
docs = [
    "mkdocs<2",
    "mkdocs-material>=9.5",
    "mkdocstrings",
    "mkdocstrings-python",
    "mkdocs-include-markdown-plugin",
]

[project.urls]
Homepage = "https://github.com/rileyhales/river-route"
Repository = "https://github.com/rileyhales/river-route"

[project.scripts]
rr = "river_route._cli:main"

[tool.hatch.version]
path = "river_route/_metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["river_route"]

[tool.hatch.build.targets.sdist]
include = [
    "/river_route",
    "/README.md",
    "/LICENSE.txt",
]
