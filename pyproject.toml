[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "river-route"
dynamic = ["version"]
description = "Perform river routing computations on large river networks"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.14"
authors = [
    { name = "Riley Hales PhD" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "dask==2026.8.0",
    "geopandas>=1.0,<2",
    "netcdf4>=1.6,<2",
    "networkx>=3.0,<4",
    "numba>=0.67,<1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0,<7",
    "scipy==1.18.1",
    "shapely>=2.0,<3",
    "tqdm==4.70.1",
    "xarray==2026.7.0",
    "zarr==3.4.0",
]

[dependency-groups]
test = [
    "pytest",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]
lint = [
    "ruff",
    "mypy",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
]

[project.urls]
Homepage = "https://github.com/rileyhales/river-route"
Repository = "https://github.com/rileyhales/river-route"

[project.scripts]
rr = "river_route._cli:main"

[tool.ruff]
line-length = 120
# these exercise the unit hydrograph API that is not part of the current release
extend-exclude = ["tests/ignored_test_*.py"]

[tool.ruff.format]
exclude = ["benchmarks/*"]
skip-magic-trailing-comma = true
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "SIM"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "river_route/_metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["river_route"]

[tool.hatch.build.targets.sdist]
include = [
    "/river_route",
    "/README.md",
    "/LICENSE.txt",
]
