# river-route configuration template

# routing procedure selectors
coeff: static                    # static | dynamic
forcing: channel                 # channel | vlateral
transform: uniform               # uniform | unit_hydrograph (only read when forcing == vlateral)
network_conditioning: standard   # standard | stabilized (river routing_order, static coeff)
routing_order: river             # river | time (see the Routing Kernels reference)

# Routing network definition for rr.Router
params_file: ''                       # parquet: river_id, next_river_id, k, x; if coeff == dynamic -> alpha, beta

# Runoff forcing options for rr.RunoffGaussianGrid
vlateral_files: []                    # Option 1: vlateral already computed
grid_runoff_files: []                 # Option 2: both gridded runoff files AND a grid weights mapping file
grid_weights_file: ''                 # Option 2: both gridded runoff files AND a grid weights mapping file
grid_accumulation_type: 'incremental'        # incremental | cumulative
runoff_processing_mode: 'sequential'         # sequential | ensemble
runoff_depth_unit: ''                        # unit of the runoff depths; omit to read the file attributes, else meters
force_positive_runoff: false                 # clip negative runoff depths to zero
force_uniform_timesteps: true                # resample runoff with irregular timesteps to the first timestep
as_volumes: false                            # RunoffGaussianGrid prepares volumes (m3) instead of depths (m); routing always uses volumes

# Where to place outputs
discharge_dir: ''                  # directory for output netCDF files (named after input files)
discharge_files: []                # one output path per input file routed, in the same order

# Variable names
var_river_id: 'river_id'
var_discharge: 'Q'
var_grid_runoff: 'ro'
var_x: 'x'
var_y: 'y'
var_t: 'time'

# Time options
dt_routing: 0                    # seconds; routing sub-step (defaults to dt_runoff)
dt_total: 0                      # seconds; total duration (defaults to full input)
dt_discharge: 0                  # seconds; output timestep (defaults to dt_runoff)
dt_runoff: 0                     # seconds; auto-detected from input file if omitted
start_datetime: '1970-01-01'     # ISO date for output timestamps

# Initial and final state
channel_state_init_file: ''      # parquet: column Q; omit to default to zero
channel_state_final_file: ''     # omit to skip writing

# Unit Hydrograph definitions (Only when forcing == vlateral and transform == unit_hydrograph)
uh_kernel_file: ''               # scipy sparse npz: shape (n_basins, n_timesteps)
uh_state_init_file: ''           # parquet: shape (n_basins, n_timesteps); for warm-starting across runs
uh_state_final_file: ''          # omit to skip writing

# General debugging and logging options
log: true
progress_bar: true
log_level: 'PROGRESS'            # DEBUG | INFO | PROGRESS | WARNING | ERROR | CRITICAL
log_stream: 'stdout'             # stdout | /path/to/logfile.log
log_format: '%(levelname)s - %(asctime)s - %(message)s'
unstable_coefficients: 'warn'    # warn | raise | ignore, when a river is not stable for dt_routing
